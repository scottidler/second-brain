[package]
name = "cortex"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Vault governance and intelligence companion for Obsidian"

[dependencies]
vault = { path = "../vault", features = ["search", "watcher", "vec"] }
chrono = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
croner = "3.0.1"
dirs = { workspace = true }
eyre = { workspace = true }
fs2 = { workspace = true }
glob = "0.3"
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shellexpand = { workspace = true }
tokio = { workspace = true }
ureq = { version = "3.2.0", features = ["json"] }
unicode-normalization = { workspace = true }
walkdir = { workspace = true }
rayon.workspace = true
distillers = { path = "../distillers" }
url = { workspace = true }
sha2 = "0.11.0"

[dev-dependencies]
serial_test = { workspace = true }
tempfile = { workspace = true }
# The REAL BGE tokenizer, driven from the committed
# `tests/fixtures/bge-small-en-v1.5-tokenizer.json`, so the hub retrieval
# contract (both vectors inside the 512-token window) is asserted offline in
# `otto ci`. Same version vault's Candle encoder loads; tokenization needs no
# model weights.
tokenizers = "0.23.1"

[lints]
workspace = true

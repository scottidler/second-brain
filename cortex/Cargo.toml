[package]
name = "cortex"
version.workspace = true
edition.workspace = true
authors.workspace = true
build = "build.rs"
description = "Vault governance and intelligence companion for Obsidian"

[dependencies]
vault = { path = "../vault", features = ["search", "watcher"] }
chrono = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
croner = "3.0.1"
dirs = { workspace = true }
env_logger = { workspace = true }
eyre = { workspace = true }
fs2 = { workspace = true }
glob = "0.3"
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shellexpand = { workspace = true }
tokio = { workspace = true }
ureq = { version = "3.2.0", features = ["json"] }
walkdir = { workspace = true }
which = "8.0.2"
rayon.workspace = true
distillers = { version = "0.5.47", path = "../distillers" }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27"

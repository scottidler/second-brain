summary: "This is a comprehensive guide from a Claude Code expert covering the top 10 plugins, skills, and CLI tools to install when starting with Claude Code in 2026. The creator focuses on practical tools that solve real problems - from using Codex for adversarial code review to bypass Claude's tendency to approve its own work, to connecting Google Workspace for personal assistant workflows. The recommendations span code quality, knowledge management, web automation, design, and productivity, with an emphasis on tools that are actively maintained and provide clear value over Claude Code's built-in features."
tldr: "A curated list of 10 essential plugins and CLI tools for Claude Code in 2026, focusing on code review, knowledge management, web automation, and productivity workflows that go beyond the basic capabilities."
enumeration:
  lead-in: "The creator covers 10 essential Claude Code tools and plugins:"
  declared-count: 10
  items:
  - name: "Codex Plugin"
    text: "Enables OpenAI's Codex to perform adversarial code reviews of Claude's output, providing unbiased assessment of code quality."
    anchor: "00:00:16"
  - name: "Obsidian + Obsidian Skills"
    text: "Creates a knowledge management system using markdown files with visual knowledge graphs for organizing large document collections."
    anchor: "00:03:03"
  - name: "Auto Research"
    text: "Machine learning algorithm that automatically runs experiments to optimize programs, keeping improvements and discarding failures."
    anchor: "00:04:46"
  - name: "Awesome Design MD"
    text: "Front-end design templates based on popular websites like Claude and Notion, providing structured design files instead of generic AI output."
    anchor: "00:05:39"
  - name: "FireCrawl CLI"
    text: "Web scraping tool that bypasses anti-bot protections and returns data in structured formats optimized for LLMs."
    anchor: "00:07:32"
  - name: "Playwright CLI"
    text: "Browser automation tool that creates Chrome instances for testing websites and form submissions using accessibility trees instead of expensive screenshots."
    anchor: "00:08:46"
  - name: "Notebook LM Pine"
    text: "CLI tool connecting Claude Code to Google's Notebook LM for batch processing, slide generation, and analysis offloaded to Google servers."
    anchor: "00:10:32"
  - name: "Skill Creator Skill"
    text: "Official plugin for creating custom skills with built-in benchmarking and A/B testing to measure performance improvements."
    anchor: "00:12:05"
  - name: "Light RAG"
    text: "Open-source graph RAG system for handling large document collections when Obsidian reaches its scale limitations."
    anchor: "00:13:16"
  - name: "GWS (Google Workspace CLI)"
    text: "Connects Claude Code to entire Google suite including email, docs, and calendar with pre-built workflow skills."
    anchor: "00:13:55"
key-ideas:
- "Adversarial validation prevents AI blind spots: large language models rarely criticize their own code, making external review tools like Codex essential for quality assurance."
- "Free alternatives often outperform paid MCP versions: the Playwright CLI is both more effective and cheaper than the official Playwright MCP, showing that newer isn't always better."
- "Offloading analysis saves tokens: tools like Notebook LM Pine that leverage external processing power can dramatically reduce Claude Code usage costs while maintaining functionality."
- "Skills need measurement to be useful: without benchmarking capabilities, it's impossible to know if custom skills actually improve outputs versus baseline performance."
- "Scale determines tool choice: simple solutions like Obsidian work great until you hit thousands of documents, at which point dedicated RAG systems become necessary."
claims:
- text: "Most large language models, including opus 4.6 and sonnet 4.6, look favorably on their own code and won't criticize it, making external review tools essential."

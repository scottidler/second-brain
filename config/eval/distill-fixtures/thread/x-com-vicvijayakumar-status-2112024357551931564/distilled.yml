summary: Vic Vijayakumar reacts to boris's flowchart depicting an AI-driven code review loop (agent generates code, self-verifies, gets reviewed by a second agent, passes automated checks, and ships unless a novel issue triggers human review) by claiming every organization is currently building this exact pipeline. Vic adds that large companies ('bigco') will be blocked from the final step—shipping without human review—due to regulatory constraints, but can still use the loop to dramatically accelerate most of their software development lifecycle.

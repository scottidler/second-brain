transcript: |
  # Post by Vic 📠 (@VicVijayakumar)

  every single org is building this loop right now.

  if you're at a bigco, you will not be able to do the last step because of regulatory hurdles, but you can still dramatically speed up 90% of your sdlc

  ## Quoted post by boris (@boristane)

  the only sane code review loop

  ### Image 1 (in @boristane's post)

  #### Description

  A flowchart depicting a code review and deployment process. It begins with "Agent generates code," flows through self-verification, a second agent review, and automated checks, leading to an "All clear?" decision point. If clear, the code ships; if not, it either returns to code generation (resolvable issues) or goes to human review (novel issues), which then loops back to code generation.


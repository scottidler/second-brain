summary: NotebookLM CLI & MCP Server provides programmatic access to Google NotebookLM through both a command-line interface and Model Context Protocol server. It enables AI assistants and users to create notebooks, add sources, generate podcasts/videos, query content, and manage NotebookLM functionality via natural language or CLI commands. The tool uses internal APIs and requires cookie-based authentication from a browser session.
claims:
- text: Uses internal undocumented APIs that may change without notice and require cookie extraction from browser sessions
  anchor: null
- text: Provides 35 MCP tools for AI assistants to interact with NotebookLM functionality
  anchor: null
- text: Supports automatic authentication with multiple Google accounts through isolated browser profiles
  anchor: null
- text: Includes automatic token refresh and handles CSRF token expiration
  anchor: null
- text: Requires Python 3.11+ and works with NotebookLM Pro/free and Google AI Ultra tier accounts
  anchor: null

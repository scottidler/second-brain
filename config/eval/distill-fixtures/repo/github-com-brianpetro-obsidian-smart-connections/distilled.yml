summary: Smart Connections is an Obsidian plugin that automatically finds semantically related notes using local embeddings. It provides a Connections view showing relevant notes for your current context and a Lookup view for semantic search across your vault, with zero setup required.
claims:
- text: Ships with a local embedding model that works offline without requiring API keys or external services
  anchor: null
- text: Uses semantic similarity rather than text matching to find connections between notes
  anchor: null
- text: Automatically indexes your vault and updates connections as you work
  anchor: null
- text: Allows dragging results to create links and copying connections as context for AI tools
  anchor: null
- text: Works on mobile devices and supports pinning or hiding specific connections
  anchor: null

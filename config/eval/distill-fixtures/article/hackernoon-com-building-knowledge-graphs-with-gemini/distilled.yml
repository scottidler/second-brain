summary: This article demonstrates how to build knowledge graphs from unstructured documents using Gemini, Google's LLM. It covers the complete process from prototyping with simple prompts to optimizing structured outputs using TSV format instead of JSON for better token efficiency, and includes visualization techniques for understanding extracted relationships between entities.
claims:
- text: TSV output format provides 30-40% savings in output tokens compared to compact JSON and 60-70% savings compared to standard JSON when generating knowledge graphs.
  anchor: null
- text: Gemini can process multiple document formats natively including text, PDF, images, audio, and video for knowledge graph extraction.
  anchor: null
- text: The article demonstrates extracting knowledge graphs from books containing 800k+ tokens in a single API request.
  anchor: null
- text: Knowledge graphs consist of entities (nodes) and relationships (edges) that can be structured as two linked tables with fields like id, name, label for entities and source_id, link, target_id for relationships.
  anchor: null
- text: Setting temperature=0.0, top_p=0.0, and seed=42 in Gemini configuration minimizes randomness for more deterministic data extraction results.
  anchor: null
- text: The tabular extraction approach uses structured prompts with data schema, instructions, and output format sections to generate consistent results.
  anchor: null
- text: NetworkX library can be used to build network graphs from extracted knowledge graph data and calculate node centralities to identify key entities.
  anchor: null

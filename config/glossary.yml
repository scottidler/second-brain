# Concept glossary for `sb cortex link` (Phase 2 of graph-augmented-memory).
#
# `concepts` are kebab-case slugs (mirroring canonical-tags.yml). Each is
# linked at the first body mention as [[slug]] (or [[slug|Surface]] when the
# prose case differs). Short slugs (< actions.linking.min-word-length, default
# 5) only link via an `aliases` entry whose surface form is long enough.
#
# `aliases` map a surface form found in prose to the canonical slug; the linker
# emits a piped wikilink [[slug|surface]] preserving the displayed wording.
# Seeded from the AI/tech vocabulary already evidenced across the vault.


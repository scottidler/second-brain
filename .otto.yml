otto:
  api: 1
  tasks: [ci]
  envs:
    VERSION: "$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"
    # Temporary bump: borg/src/pipeline.rs has grown past 3100 lines as Phase 2
    # of docs/design/2026-04-19-staged-ingestion-pipeline.md wires Stage-0 hooks
    # into process_content / process_article_*, plus frame-aware YouTube
    # ingestion (try_extract_slides + slide publish/cleanup wiring) from
    # docs/design/2026-04-29-frame-aware-youtube-ingestion.md. As of Phase 9
    # (docs/design/2026-05-16-extractor-contract-l2-phase-9-cleanup.md) the
    # Idea/Vocab cutovers add distiller-dispatch + render + frontmatter-
    # additions blocks (9c-image and 9c-voicenote add more on the image/audio
    # processors). vault/src/search.rs is 1622. Drop back to 1500 once
    # pipeline.rs is decomposed into stages/*.rs and search.rs is split.
    BLOAT_MAX_LINES: "3600"

tasks:
  lint:
    help: "Run whitespace linting"
    bash: |
      whitespace -r

  bloat:
    help: "Fail if any source file exceeds BLOAT_MAX_LINES (default 1500)"
    bash: |
      LIMIT="${BLOAT_MAX_LINES:-1500}"
      FAILED=0
      echo "=== Checking file line counts (limit: $LIMIT) ==="
      while IFS= read -r file; do
        lines=$(wc -l < "$file")
        if [ "$lines" -gt "$LIMIT" ]; then
          delta=$((lines - LIMIT))
          echo "  FAIL: $file ($lines lines, +$delta over limit)"
          FAILED=1
        fi
      done < <(find . -type f \( -name "*.rs" -o -name "*.py" -o -name "*.js" -o -name "*.ts" \) \
        -not -path "*/target/*" \
        -not -path "*/node_modules/*" \
        -not -path "*/.venv/*" \
        -not -path "*/__pycache__/*" \
        -not -path "*/dist/*" \
        -not -path "*/build/*" \
        -not -path "*/.git/*")
      if [ "$FAILED" -eq 1 ]; then
        echo ""
        echo "Decompose these files into modules before proceeding."
        exit 1
      fi
      echo "All files within $LIMIT line limit"

  check:
    help: "Run all quality checks (compile, clippy, format)"
    bash: |
      # vault's `vec-candle` + `vec-fastembed` features are mutually
      # exclusive at compile time (compile_error! guard). Drive CI with
      # `--features vec` (the public flag that resolves to Candle today)
      # rather than `--all-features`, which would trip the guard.
      echo "=== Checking compilation ==="
      cargo check --workspace --all-targets --features vec
      echo ""
      echo "=== Running Clippy ==="
      cargo clippy --workspace --all-targets --features vec -- -D warnings
      echo ""
      echo "=== Checking format ==="
      cargo fmt --all --check
      echo ""
      echo "✅ All checks passed!"

  test:
    help: "Run all tests"
    bash: |
      cargo test --workspace --features vec

  cov:
    help: "Run tests with coverage via llvm-cov"
    after: [cov-report]
    bash: |
      echo "Running tests with coverage..."

      JSON_FILE="$OTTO_TASK_DIR/coverage.json"

      TEST_FAILED=0
      if ! cargo llvm-cov --all-features --json --output-path "$JSON_FILE" 2>&1; then
        TEST_FAILED=1
      fi

      if [ ! -s "$JSON_FILE" ] || ! jq -e '.data[0].totals' "$JSON_FILE" >/dev/null 2>&1; then
        echo "Tests failed - no coverage data generated"
        exit 1
      fi

      cargo llvm-cov report --html --output-dir target/llvm-cov/html >/dev/null 2>&1 || true

      otto_set_output "json_path" "$JSON_FILE"
      otto_set_output "test_failed" "$TEST_FAILED"
      otto_set_output "lines_pct" "$(jq -r '.data[0].totals.lines.percent // 0' "$JSON_FILE")"
      otto_set_output "lines_cov" "$(jq -r '.data[0].totals.lines.covered // 0' "$JSON_FILE")"
      otto_set_output "lines_tot" "$(jq -r '.data[0].totals.lines.count // 0' "$JSON_FILE")"
      otto_set_output "funcs_pct" "$(jq -r '.data[0].totals.functions.percent // 0' "$JSON_FILE")"
      otto_set_output "funcs_cov" "$(jq -r '.data[0].totals.functions.covered // 0' "$JSON_FILE")"
      otto_set_output "funcs_tot" "$(jq -r '.data[0].totals.functions.count // 0' "$JSON_FILE")"
      otto_set_output "regions_pct" "$(jq -r '.data[0].totals.regions.percent // 0' "$JSON_FILE")"

  cov-report:
    help: "Display coverage report"
    params:
      --fail-under:
        default: "0"
        help: "Minimum line coverage percentage (0 = no threshold)"
      --json:
        default: "false"
        help: "Output raw JSON coverage data"
      --details:
        default: "false"
        help: "Show detailed per-file coverage"
    bash: |
      color_pct() {
        local pct=$1
        local int_pct=${pct%.*}
        if [ "$int_pct" -ge 80 ]; then echo -e "${GREEN}${pct}%${NC}"
        elif [ "$int_pct" -ge 60 ]; then echo -e "${YELLOW}${pct}%${NC}"
        else echo -e "${RED}${pct}%${NC}"; fi
      }

      JSON_PATH=$(otto_get_input "cov.json_path")
      TEST_FAILED=$(otto_get_input "cov.test_failed")
      LINES_PCT=$(printf "%.1f" "$(otto_get_input "cov.lines_pct")")
      LINES_COV=$(otto_get_input "cov.lines_cov")
      LINES_TOT=$(otto_get_input "cov.lines_tot")
      FUNCS_PCT=$(printf "%.1f" "$(otto_get_input "cov.funcs_pct")")
      FUNCS_COV=$(otto_get_input "cov.funcs_cov")
      FUNCS_TOT=$(otto_get_input "cov.funcs_tot")
      REGIONS_PCT=$(printf "%.1f" "$(otto_get_input "cov.regions_pct")")

      if [ "${json}" = "true" ]; then
        cat "$JSON_PATH"
        exit $TEST_FAILED
      fi

      if [ "${details}" = "true" ]; then
        echo -e "${BOLD}${CYAN}Per-file Coverage:${NC}"
        echo -e "${DIM}────────────────────────────────────────────────────────${NC}"
        jq -r '.data[0].files[] | "\(.filename)|\(.summary.lines.percent // 0)|\(.summary.lines.covered // 0)|\(.summary.lines.count // 0)"' "$JSON_PATH" | \
        sort -t'|' -k2 -n | while IFS='|' read -r file pct covered total; do
          display=$(echo "$file" | sed 's|.*/src/||')
          [ ${#display} -gt 40 ] && display="...${display: -37}"
          int_pct=${pct%.*}
          if [ "$int_pct" -ge 80 ]; then color=$GREEN
          elif [ "$int_pct" -ge 60 ]; then color=$YELLOW
          else color=$RED; fi
          printf "  %-42s %b%6.1f%%%b %b(%d/%d)%b\n" "$display" "$color" "$pct" "$NC" "$DIM" "$covered" "$total" "$NC"
        done
        echo -e "${DIM}────────────────────────────────────────────────────────${NC}"
        echo ""
      fi

      echo -e "${BOLD}${CYAN}Coverage Summary${NC}"
      echo -e "${DIM}────────────────────────────────────────${NC}"
      echo -e "  ${BOLD}Lines:${NC}     $(color_pct $LINES_PCT)  ${DIM}(${LINES_COV}/${LINES_TOT})${NC}"
      echo -e "  ${BOLD}Functions:${NC} $(color_pct $FUNCS_PCT)  ${DIM}(${FUNCS_COV}/${FUNCS_TOT})${NC}"
      echo -e "  ${BOLD}Regions:${NC}   $(color_pct $REGIONS_PCT)"
      echo -e "${DIM}────────────────────────────────────────${NC}"
      echo ""

      THRESHOLD_FAILED=0
      if [ "${fail_under}" != "0" ]; then
        LINES_INT=${LINES_PCT%.*}
        THRESHOLD_INT=${fail_under%.*}
        if [ "$LINES_INT" -lt "$THRESHOLD_INT" ]; then
          THRESHOLD_FAILED=1
          echo -e "${RED}${BOLD}✗ Coverage ${LINES_PCT}% is below ${fail_under}% threshold${NC}"
        else
          echo -e "${GREEN}${BOLD}✓ Coverage ${LINES_PCT}% meets ${fail_under}% threshold${NC}"
        fi
        echo ""
      fi

      echo -e "${BLUE}Report:${NC} target/llvm-cov/html/index.html"

      [ "$TEST_FAILED" = "1" ] || [ "$THRESHOLD_FAILED" = "1" ] && exit 1 || true

  ci:
    help: "Full CI pipeline (lint + bloat + check + test in parallel)"
    before: [lint, bloat, check, test]
    bash: |
      echo "✅ All CI checks passed!"

  build:
    help: "Build release binaries for all workspace members"
    bash: |
      cargo build --release --workspace
      echo "✅ Release build complete"

  extension:
    help: "Sign the Firefox extension; pass --install to xdg-open the .xpi for browser install"
    bash: |
      bin/extension-sign "$@"

  clean:
    help: "Clean build artifacts"
    bash: |
      cargo clean
      echo "✅ Build artifacts cleaned"

  update:
    help: "Refresh Cargo.lock to pick up newer transitive dep versions"
    bash: |
      cargo update
      echo "✅ Cargo.lock refreshed; run 'otto deploy' to install with the new lock"

  install:
    help: "Install workspace binaries locally (one parallel cargo build, locked)"
    bash: |
      cargo build --release --locked --workspace --bins
      BINS=$(cargo metadata --format-version 1 --no-deps \
        | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name' \
        | sort -u)
      for bin in $BINS; do
        install -m 0755 "target/release/$bin" "$HOME/.cargo/bin/$bin"
      done
      echo "✅ Installed to ~/.cargo/bin: $(echo $BINS | tr '\n' ' ')"

  deploy:
    help: "Build sb, install bin + assets, restart workspace daemons (units come from `sb borg|cortex daemon --install`)"
    bash: |
      cargo build --release --locked --workspace --bins
      BINS=$(cargo metadata --format-version 1 --no-deps \
        | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name' \
        | sort -u)
      for bin in $BINS; do
        install -m 0755 "target/release/$bin" "$HOME/.cargo/bin/$bin"
      done

      # Sync borg fabric patterns to where vault::fabric::resolve_pattern looks.
      # Source-of-truth lives in borg/patterns/; this avoids drift between repo
      # state and the deployed install location (the gap that caused the
      # 2026-05-16 fabric-error regression).
      mkdir -p "$HOME/.config/borg/patterns"
      cp -f borg/patterns/*.md "$HOME/.config/borg/patterns/"

      # Sync shared config (canonical tags, tag mapping, tag proposals) so
      # borg + cortex agree on the canonical vocabulary.
      mkdir -p "$HOME/.config/second-brain"
      cp -f config/*.yml "$HOME/.config/second-brain/"

      # Restart any workspace daemons whose systemd units exist. Units are
      # written + maintained by `sb borg daemon --install` and `sb cortex
      # daemon --install` (not by this deploy task) so the source of truth
      # for unit content stays in-binary.
      DAEMONS=""
      for unit in borg cortex; do
        if systemctl --user cat "$unit.service" >/dev/null 2>&1; then
          DAEMONS="$DAEMONS $unit"
        fi
      done
      [ -n "$DAEMONS" ] && systemctl --user restart $DAEMONS

      echo "✅ Installed bins:$(echo $BINS | tr '\n' ' ' | sed 's/^/ /')"
      echo "✅ Synced patterns -> ~/.config/borg/patterns/, shared config -> ~/.config/second-brain/"
      echo "✅ Restarted daemons:${DAEMONS:- (none — run \`sb borg daemon --install\` / \`sb cortex daemon --install\` first)}"

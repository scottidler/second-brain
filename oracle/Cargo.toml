[package]
name = "oracle"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "MCP server for querying an Obsidian vault's ingested knowledge"
license = "MIT"

[lib]
name = "oracle"
path = "src/lib.rs"

[dependencies]
vault = { path = "../vault", features = ["schemars", "search", "watcher", "vec"] }
rmcp = { version = "1.3.0", features = ["server", "macros"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
eyre = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
rusqlite = { version = "0.34", features = ["bundled"] }

[build-dependencies]

[dev-dependencies]
tempfile = "3.27"

[workspace]
members = ["vault", "distillers", "borg", "cortex", "oracle", "sb"]
default-members = ["sb"]
resolver = "3"

[workspace.package]
version = "0.8.82"
edition = "2024"
authors = ["Scott Idler <scott.a.idler@gmail.com>"]

# Centralized lint policy. Mirrors the rust denies the crates already apply at
# their roots (`#![deny(dead_code)]`, `#![deny(unused_variables)]`), now in one
# place via `lints.workspace = true`. clippy::unwrap_used stays a per-crate
# `#![deny]` (with `#[allow]` on test modules) because a workspace-level deny
# would also fire in tests, where unwrap is permitted.
[workspace.lints.rust]
dead_code = "deny"
unused_variables = "deny"

# Deliberate profile tuning for the candle / libsignal / aws-lc build weight.
# Dev builds compile dependencies at opt-level 2 (the ML/crypto crates are
# unusably slow at 0); our own crates stay at the dev default for fast
# edit-compile cycles. Release keeps thin LTO — full LTO's link time is not
# worth it for a daemon that restarts rarely.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
dirs = "6.0"
env_logger = "0.11"
eyre = "0.6"
fs2 = "0.4"
log = "0.4"
rayon = "1.12"
regex = "1"
rmcp = { version = "1.3.0", features = ["server", "macros"] }
rusqlite = { version = "0.34", features = ["bundled"] }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serial_test = "3.4.0"
shellexpand = "3.1"
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls", "rustls-native-roots"] }
tempfile = "3.27"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
walkdir = "2.5"

# libsignal's workspace patches curve25519-dalek to Signal's fork; consuming
# libsignal-protocol/net/net-chat as git deps (via signal-rs) does not carry
# that patch over, so we replicate it here. Without this block we get two
# versions of curve25519-dalek (upstream pulled by ed25519-dalek, Signal's
# fork pulled by zkgroup), which fails to compile. `boring` is patched for
# the same reason - libsignal-net pulls it in for TLS.
[patch.crates-io]
boring     = { git = "https://github.com/signalapp/boring", tag = "signal-v5.0.2" }
boring-sys = { git = "https://github.com/signalapp/boring", tag = "signal-v5.0.2" }
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

[workspace]
members = ["vault", "distillers", "borg", "cortex", "oracle", "facet", "sb"]
default-members = ["sb"]
resolver = "3"

[workspace.package]
version = "0.8.34"
edition = "2024"
authors = ["Scott Idler <scott.a.idler@gmail.com>"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
colored = "3.1"
dirs = "6.0"
env_logger = "0.11"
eyre = "0.6"
fs2 = "0.4"
log = "0.4"
rayon = "1.12"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shellexpand = "3.1"
tokio = { version = "1", features = ["full"] }
walkdir = "2.5"

# libsignal's workspace patches curve25519-dalek to Signal's fork; consuming
# libsignal-protocol/net/net-chat as git deps (via signal-rs) does not carry
# that patch over, so we replicate it here. Without this block we get two
# versions of curve25519-dalek (upstream pulled by ed25519-dalek, Signal's
# fork pulled by zkgroup), which fails to compile. `boring` is patched for
# the same reason - libsignal-net pulls it in for TLS.
[patch.crates-io]
boring     = { git = "https://github.com/signalapp/boring", tag = "signal-v5.0.2" }
boring-sys = { git = "https://github.com/signalapp/boring", tag = "signal-v5.0.2" }
curve25519-dalek = { git = "https://github.com/signalapp/curve25519-dalek", tag = "signal-curve25519-4.1.3" }

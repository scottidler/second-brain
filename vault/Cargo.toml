[package]
name = "vault"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Shared library crate for Obsidian vault types, frontmatter, and utilities"

[features]
# Test doubles and fixture helpers (`MockEmbedder`, `MockReranker`, `insert_test_*`,
# the WARN capture); enabled by dev-dependencies, never in a release build.
test-util = ["dep:socket2"]
schemars = ["dep:schemars"]
search = ["dep:rusqlite"]
watcher = ["dep:notify", "dep:tokio"]
# One reqwest client constructor (`vault::http`) and the borg-daemon client
# (`vault::daemon::client`); borg and oracle enable it.
http = ["dep:reqwest"]

# vec stays the public "embedding is on" flag. It pulls in `search` and
# both backends: Candle (no AVX2 floor, runs on any x86_64 CPU) and ONNX
# Runtime (needs AVX2+FMA; `vault::cpu` gates it at runtime, before any
# ORT call, so carrying it on a pre-AVX2 CPU such as `talos` is safe).
vec = ["vec-candle", "vec-onnx"]

# Backend-specific flags. Each pulls in `search` so a build that names only
# one backend still wires up the SQL layer.
vec-candle = [
    "search",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
vec-onnx = [
    "search",
    "dep:ort",
    "dep:tokenizers",
    "dep:hf-hub",
]

[dependencies]
rusqlite = { workspace = true, optional = true }
chrono = { workspace = true }
dirs = { workspace = true }
env_logger = { workspace = true }
expand-tilde = { workspace = true, features = ["serde"] }
eyre = { workspace = true }
fs2 = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
notify = { version = "7", optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shellexpand = { workspace = true }
unicode-normalization = { workspace = true }
walkdir = { workspace = true }
rayon = { workspace = true }
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
candle-transformers = { version = "0.10.2", optional = true }
tokenizers = { version = "0.23.1", optional = true }
hf-hub = { version = "0.5.0", optional = true, default-features = false, features = ["tokio", "ureq", "rustls-tls"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
file-rotate = "0.8.0"
libc = "0.2.186"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"], optional = true }
humantime = "2.4.0"
socket2 = { version = "0.6.3", optional = true }
# Static ONNX Runtime (pyke archive, hash-pinned by ort-sys). Default features
# trimmed: no `tracing` (ORT logs route to `log` through `vault::onnx`), no
# native-tls/openssl (the build-time archive download uses rustls), no ndarray.
ort = { version = "2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-31"] }

[dev-dependencies]
vault = { path = ".", features = ["test-util"] }
criterion = "0.8.2"
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio.workspace = true

# Re-executes itself as the signalled harness process, so it owns main().
[[test]]
name = "interrupt"
harness = false

[[bench]]
name = "hybrid"
harness = false
required-features = ["vec"]

[lints]
workspace = true

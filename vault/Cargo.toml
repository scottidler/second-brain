[package]
name = "vault"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Shared library crate for Obsidian vault types, frontmatter, and utilities"

[features]
schemars = ["dep:schemars"]
search = ["dep:rusqlite"]
watcher = ["dep:notify", "dep:tokio"]
vec = ["search", "dep:fastembed"]

[dependencies]
rusqlite = { version = "0.34", features = ["bundled"], optional = true }
chrono = { workspace = true }
dirs = { workspace = true }
env_logger = { workspace = true }
eyre = { workspace = true }
fs2 = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
notify = { version = "7", optional = true }
schemars = { version = "1.2", optional = true }
serde = { workspace = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
shellexpand = { workspace = true }
walkdir = { workspace = true }
rayon = { workspace = true }
fastembed = { version = "5.13.4", optional = true }

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27"

[[bench]]
name = "hybrid"
harness = false
required-features = ["vec"]

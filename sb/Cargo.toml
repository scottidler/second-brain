[package]
name = "sb"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "second-brain unified CLI: borg ingestion + cortex governance + oracle MCP"
build = "build.rs"

[dependencies]
borg = { path = "../borg" }
cortex = { path = "../cortex" }
oracle = { path = "../oracle" }
vault = { path = "../vault", features = ["search", "watcher", "vec"] }
distillers = { path = "../distillers" }

clap = { workspace = true }
eyre = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2.4"
dirs = { workspace = true }
shellexpand = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
serde_yaml.workspace = true
serde.workspace = true
terminal_size = "0.4.4"
chrono.workspace = true
unicode-width = { workspace = true }
humantime = "2.4.0"

[dev-dependencies]
vault = { path = "../vault", features = ["search", "watcher", "vec", "test-util"] }
serial_test = { workspace = true }
socket2 = "0.6.3"
tempfile = { workspace = true }

[lints]
workspace = true

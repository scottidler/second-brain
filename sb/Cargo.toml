[package]
name = "sb"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "second-brain unified CLI: borg ingestion + cortex governance + oracle MCP"
build = "build.rs"

[dependencies]
borg = { path = "../borg" }
cortex = { path = "../cortex" }
oracle = { path = "../oracle" }
vault = { path = "../vault", features = ["search", "watcher", "vec"] }
distillers = { path = "../distillers" }

clap = { workspace = true }
eyre = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
dirs = { workspace = true }
shellexpand = { workspace = true }
colored = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "1.3.0", features = ["server", "macros"] }
serde_yaml.workspace = true
serde.workspace = true
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls", "rustls-native-roots"] }
hostname = "0.4.2"
signal-rs = { git = "https://github.com/scottidler/signal-rs", tag = "v0.2.1", version = "0.2.1" }

[dev-dependencies]
serial_test = "3.4.0"
tempfile = "3.27.0"

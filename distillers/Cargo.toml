[package]
name = "distillers"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Per-kind Stage-2 distillers producing the vault::Distilled contract"

[dependencies]
vault = { path = "../vault" }
async-trait = "0.1"
chrono = { workspace = true }
eyre = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
futures = "0.3.32"

[dev-dependencies]
# Tests round-trip rendered markdown through the vault::search body parsers,
# which are feature-gated behind `search`. Production builds of distillers do
# NOT enable this feature, so rusqlite stays out of the borg dependency tree.
vault = { path = "../vault", features = ["search"] }

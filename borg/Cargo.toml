[package]
name = "borg"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
vault = { path = "../vault" }
distillers = { path = "../distillers" }
axum = { version = "0.8.8", features = ["multipart"] }
chrono = { workspace = true }
chrono-tz = "0.10"
clap = { workspace = true }
colored = { workspace = true }
dirs = { workspace = true }
env_logger = { workspace = true }
eyre = { workspace = true }
fs2 = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "multipart", "stream", "charset", "http2", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
shellexpand = { workspace = true }
thiserror = "2.0.18"
teloxide = { version = "0.17", default-features = false, features = ["macros", "ctrlc_handler", "rustls", "rustls-native-roots"] }
tokio = { workspace = true }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors"] }
url = "2.5.8"
urlencoding = "2.1"
arboard = "3"
notify-rust = "4"
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["io"] }
hostname = "0.4.2"
base64 = "0.22"
async-trait = "0.1.89"
image_hasher = "3.1.1"
image = "0.25.10"
rayon = { workspace = true }
tempfile = "3.27.0"
rusqlite = { version = "0.34", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.27.0"
schemars = "1.2.1"
signal-rs = { git = "https://github.com/scottidler/signal-rs", tag = "v0.2.1", version = "0.2.1" }
humantime = "2.3.0"

[dependencies.serenity]
version = "0.12"
default-features = false
features = ["client", "gateway", "model", "rustls_backend"]

[dev-dependencies]
filetime = "0.2.27"

    **Code artifacts (uncommitted) — what''s worth committing:**


    1. **Parallelism + skip-empty + stale-render sweep + quarantine pass + cross-repo dedup gate** — five distinct fixes to `daemon/harvest.rs` and the ledger queries that support them.

    2. **`prisms/` + `spectra/` + `quarantine/` + `archive/` layout** — config field rename, struct rename, template + live config update, e2e test path update.

    3. **YAML → JSON extract pipeline** — pattern rewritten, parser switched, fence-stripper extended, fixtures converted, 91 tests still green.

    4. **`facet/src/render/quarantine.rs`** — new submodule for failure notes with full schema (frontmatter, context, error block, retry hint).

    5. **`facet/src/dedupe.rs` + tests + `sb facet dedupe [--dry-run]` subcommand** — slug-suffix merge tool. 9 unit tests covering the planner, the suffix stripper, and SQL collision behavior under `UPDATE OR IGNORE`. Idempotent in production (second run reports zero merges).


    The five stuck sessions are genuine quality failures — the LLM occasionally emits prose or YAML instead of JSON for certain session content. They''re quarantined, visible in Obsidian, retriable via `sb facet retry <uuid>`. Not a bug in our code path; a known-bounded LLM unreliability.


